<style>
/* Layout: a dim pipeline tree on the left; the cards stack vertically on the right, focused card ~60% of the height, neighbours above and below shrink by distance. */
/* GroundControl tokens, single dark look by choice (the deck is dark navy). */
:root {
  --ground:#0e192b; --ground-glow:#152b50; --surface:#13233a; --surface-raised:#1d3a64;
  --line:#33476c; --line-strong:#6b7889;
  --ink:#fefeff; --ink-muted:#c4cfe1; --ink-subtle:#97a2b4;
  --blue:#4c8dff; --blue-light:#8eb4ff; --green:#3ebf80; --orange:#f2a33b;
  --paper:#f7f8fc; --paper-tint:#e8eefe; --paper-line:#ecedf2;
  --paper-ink:#13213c; --paper-ink-muted:#5b6475; --paper-blue:#2357de;
  --ph-word:#c3cad8; /* the big placeholder word: low contrast on paper on purpose */
  --font-display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --font-sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;
  color-scheme: dark;
}
html,body{height:100%}
body{
  background: radial-gradient(ellipse at 100% 0%, var(--ground-glow), var(--ground) 55%) fixed, var(--ground);
  color:var(--ink); font-family:var(--font-sans); font-size:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px; box-sizing:border-box; overflow:hidden;
  display:grid; grid-template-columns:170px minmax(0,1fr); gap:20px;
}

/* Dim tree */
.tree{min-height:0; overflow-y:auto; opacity:.55; transition:opacity .25s; scrollbar-width:none;
  display:flex; flex-direction:column; gap:10px; padding-top:2px}
.tree::-webkit-scrollbar{display:none}
.tree:hover,.tree:focus-within{opacity:1}
.tree .top{font:400 10px/1.3 var(--font-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--green)}
.ph{display:flex; flex-direction:column}
.pipe{font:500 13px/1.2 var(--font-display); color:var(--ink-muted); margin-top:6px}
.ph-name{font:400 10px/1.3 var(--font-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-subtle); margin-bottom:3px}
.leaf{all:unset; box-sizing:border-box; cursor:pointer; display:block; font:400 11.5px/1.25 var(--font-sans); color:var(--ink-subtle);
  border-left:1px solid var(--line); padding:2px 0 2px 9px; position:relative;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.leaf.closed{font-style:italic; opacity:.75}
.leaf:hover{color:var(--ink)}
.leaf.on{color:var(--ink); border-left-color:var(--blue)}
.leaf.on::before{content:""; position:absolute; left:-3px; top:50%; width:5px; height:5px; margin-top:-2.5px; border-radius:50%; background:var(--blue)}
.leaf:focus-visible{outline:1px solid var(--blue-light)}
.tree .hint{font:400 10px/1.4 var(--font-mono); color:var(--ink-subtle); margin-top:auto; padding-top:8px}

/* Vertical strip */
.strip{min-height:0; display:flex; flex-direction:column; gap:5px; overflow:hidden; touch-action:pan-x}
.sep{flex:0 0 16px; display:flex; align-items:center; gap:8px; font:400 9.5px/1 var(--font-mono); letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-subtle); white-space:nowrap}
.sep::after{content:""; flex:1; border-top:1px dotted var(--line)}
.sep.hid{flex-basis:0; opacity:0; margin-block:-2.5px}
.card{flex:0 0 0; min-height:0; overflow:hidden; background:var(--surface); border:.5px solid var(--line);
  border-radius:6px; cursor:pointer; position:relative;
  transition:flex-grow .28s cubic-bezier(.2,.7,.2,1), opacity .2s, margin .2s}
.card.d9{flex-grow:0; border-width:0; opacity:0; margin-block:-2.5px}
.card.d3{flex-grow:2.6} .card.d2{flex-grow:5} .card.d1{flex-grow:11} .card.d0{flex-grow:60; cursor:default}
.card.d0{background:var(--surface-raised); border:1px solid var(--blue)}
.card.closed{background:transparent; border-style:dashed; border-color:var(--line-strong)}
.card.closed.d0{background:var(--surface); border:1px dashed var(--line-strong)}
.inner{position:absolute; inset:0; display:flex}
.face{display:none; flex:1; min-width:0}
.card.d0 .f0, .card.d1 .f1, .card.d2 .f1, .card.d3 .f3{display:flex}
.id{font:400 11px/1.3 var(--font-mono); color:var(--blue-light); letter-spacing:.08em; flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.id b{font-weight:500; color:var(--ink)}
.flag{font:400 10px/1.2 var(--font-mono); text-transform:uppercase; letter-spacing:.12em; color:var(--orange)}

/* Condensed band: id | loop | pain -> solution */
.f1{align-items:center; gap:14px; padding:8px 14px}
.loop{flex:0 0 auto; height:100%; aspect-ratio:16/9; background:var(--paper); border-radius:5px; position:relative; overflow:hidden}
.loop i{position:absolute; left:10%; height:12%; border-radius:3px; background:var(--paper-line)}
.loop i:nth-child(1){top:22%; width:70%} .loop i:nth-child(2){top:44%; width:55%} .loop i:nth-child(3){top:66%; width:65%}
.loop i::after{content:""; position:absolute; inset:0; width:0; border-radius:3px; background:var(--paper-blue); animation:fill 1.5s ease-in-out infinite}
.loop i:nth-child(2)::after{animation-delay:.15s} .loop i:nth-child(3)::after{animation-delay:.3s}
@keyframes fill{0%{width:0}60%,85%{width:100%}100%{width:100%;opacity:0}}
.closed .loop{background:transparent; border:1px dashed var(--line)} .closed .loop i{display:none}
.txt{min-width:0; display:flex; flex-direction:column; gap:3px}
.scan{font:500 16px/1.25 var(--font-display); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.scan em{font-style:normal; color:var(--blue-light)}
.closed .scan{color:var(--ink-muted)}
.d2 .loop, .d2 .flag{display:none} .d2 .f1{padding-block:4px} .d2 .scan{font-size:13.5px}
.f3{align-items:center; gap:10px; padding:0 14px; font:400 10.5px/1 var(--font-mono); color:var(--ink-subtle); white-space:nowrap; overflow:hidden}
.f3 .id{opacity:.8}

/* Focused card: illustration left, text right, full width */
.f0{flex-direction:column; gap:12px; padding:16px 18px}
.f0 .hd{display:flex; flex-direction:column; align-items:flex-start; gap:6px}
.f0 .hd .id{max-width:100%}
.f0 h2{font:500 24px/1.2 var(--font-display); margin:0}
.f0 .body{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:24px}
.anim{background:var(--paper); border-radius:8px; position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:18px; min-height:0}
.anim::before{content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(135deg, transparent 0 14px, var(--paper-tint) 14px 28px); opacity:.7;
  animation:slide 12s linear infinite}
.anim .bar{position:absolute; left:0; top:0; height:3px; background:var(--paper-blue); animation:play 12s linear infinite}
@keyframes slide{to{background-position:400px 0}}
@keyframes play{from{width:0}to{width:100%}}
.anim{justify-content:center; gap:10px}
.anim .tag{position:relative; font:500 clamp(28px, 5.2vw, 76px)/1 var(--font-display); letter-spacing:-.01em; text-transform:uppercase;
  color:var(--ph-word); text-wrap:balance}
.anim .note{position:relative; font:400 13px/1.4 var(--font-sans); color:var(--paper-ink-muted); max-width:52ch}
.anim .what{position:relative; font:400 12px/1.4 var(--font-mono); color:var(--paper-ink-muted); max-width:60ch}
.anim .what::before{content:"Shows: "; color:var(--paper-blue)}
.lines{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; align-self:center}
.lines li{font:400 17px/1.4 var(--font-sans); color:var(--ink-muted); border-top:1px solid var(--line); padding-top:12px}
.lines li:first-child{color:var(--ink)}
.closedbox{flex:1; border:1px dashed var(--line-strong); border-radius:8px; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:24px}
.closedbox .lbl{font:400 11px/1.2 var(--font-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--orange)}
.closedbox p{margin:0; font:400 17px/1.45 var(--font-sans); color:var(--ink-muted); max-width:60ch}
.pain{font:400 12px/1.3 var(--font-mono); color:var(--ink-subtle)}

@media (max-width:760px){
  body{grid-template-columns:minmax(0,1fr)}
  .tree{display:none}
  .card.d0{flex-grow:72} .card.d1{flex-grow:9} .card.d2{flex-grow:4} .card.d3{flex-grow:0; opacity:0; border-width:0}
  .f0 .body{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(120px,1fr) auto; gap:14px}
  .lines{gap:8px} .lines li{font-size:14px; padding-top:7px}
  .f0 h2{font-size:20px}
  .d1 .loop{display:none} .scan{font-size:14px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }

 ["R-28",13,"pointer","Customer proof","No commercial evidence","Liftoff feeds the deck",null,null,"Runs on Liftoff","Customer proof for the raise runs on the Liftoff pipeline, steps L-14 to L-32. Every buyer and partner conversation feeds the deck as demand."],
];

const closed = s => s[2]==="session" || s[2]==="admin" || s[2]==="pointer";
const kindName = s => ({ admin:"Admin", pointer:"Runs on Liftoff" })[s[2]] || "Live session";
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tree = document.getElementById("tree"), strip = document.getElementById("strip");

PHASES.forEach((p, pi) => {
  const pipe = PIPES.find(x => x[1] === pi);
  if (pipe) { const h = document.createElement("div"); h.className = "pipe"; h.textContent = pipe[0]; tree.appendChild(h); }
  const g = document.createElement("div"); g.className = "ph";
  g.innerHTML = `<div class="ph-name">${esc(p)}</div>`;
  S.forEach((s, i) => { if (s[1] !== pi) return;
    const b = document.createElement("button"); b.type = "button";
    b.className = "leaf" + (closed(s) ? " closed" : ""); b.textContent = s[3];
    b.title = s[4] + " → " + s[5]; b.dataset.i = i; b.onclick = () => go(i);
    g.appendChild(b); });
  tree.appendChild(g);
});
const hint = document.createElement("div"); hint.className = "hint";
hint.textContent = "Click · ↑ ↓ · scroll. Italic = live session or admin, closed. Animations are placeholders.";
tree.appendChild(hint);

let lastPhase = -1; const seps = [];
const cards = S.map((s, i) => {
  if (s[1] !== lastPhase) { lastPhase = s[1];
    const sep = document.createElement("div"); sep.className = "sep"; sep.textContent = pipeOf(s[1]) + " · " + PHASES[s[1]];
    sep.dataset.first = i; strip.appendChild(sep); seps.push(sep); }
  const c = document.createElement("article"); c.className = "card" + (closed(s) ? " closed" : ""); c.tabIndex = -1;
  const scan = `${esc(s[4])} <em>→ ${esc(s[5])}</em>`;
  const path = `${esc(pipeOf(s[1]))} &gt; ${esc(PHASES[s[1]].replace(/^\d+\s+/, ""))}`;
  const id = `<div class="id">${path} &gt; <b>${esc(s[3])}</b></div>`;   // small tiles: path and step name
  const crumb = `<div class="id">${path}</div>`;                        // focused card: path only, the title is the heading
  const kind = kindName(s);
  const lbl = s[2]==="admin" ? "Admin step · closed in this demo" : s[2]==="pointer" ? "Runs on the Liftoff pipeline"
            : "Live session · " + esc(s[8]) + " · closed in this demo";
  const f0 = closed(s)
    ? `<div class="face f0"><div class="hd">${crumb}<h2>${esc(s[3])}</h2></div>
         <div class="closedbox"><div class="lbl">${lbl}</div>
         <p>${esc(s[9])}</p><div class="pain">Pain: ${esc(s[4])} → ${esc(s[5])}</div></div></div>`
    : `<div class="face f0"><div class="hd">${crumb}<h2>${esc(s[3])}</h2></div>
         <div class="body"><div class="anim"><div class="bar"></div><div class="tag">Animation placeholder</div>
         <div class="note">This is an animation that shows how our system solves this specific pain point.</div>
         <div class="what">${esc(s[6])}</div></div>
         <ul class="lines">${s[7].map(l => `<li>${esc(l)}</li>`).join("")}</ul></div></div>`;
  const loop = `<div class="loop">${closed(s) ? "" : "<i></i><i></i><i></i>"}</div>`;
  c.innerHTML = `<div class="inner">${f0}
    <div class="face f1">${loop}<div class="txt">${id}${closed(s)?`<div class="flag">${kind}</div>`:""}<div class="scan">${scan}</div></div></div>
    <div class="face f3">${id}</div></div>`;
  c.onclick = () => go(i);
  strip.appendChild(c); return c;
});

let cur = 0;
function go(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  cards.forEach((c, j) => { const d = Math.abs(j - cur);
    c.className = "card" + (closed(S[j]) ? " closed" : "") + " d" + (d > 3 ? 9 : d);
    c.setAttribute("aria-hidden", d > 3 ? "true" : "false"); });
  // a phase divider shows when the first card of its phase is visible
  seps.forEach(sp => sp.classList.toggle("hid", Math.abs(+sp.dataset.first - cur) > 3));
  tree.querySelectorAll(".leaf").forEach(b => { const on = +b.dataset.i === cur; b.classList.toggle("on", on);
    if (on) b.scrollIntoView({ block: "nearest" }); });
  const h = "#" + S[cur][0].toLowerCase(); if (location.hash !== h) history.replaceState(null, "", h);
}
addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "PageDown") { go(cur + 1); e.preventDefault(); }
  else if (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "PageUp") { go(cur - 1); e.preventDefault(); }
  else if (e.key === "Home") go(0); else if (e.key === "End") go(S.length - 1);
});
// Scroll distance maps to steps: every STEP_PX of wheel travel moves one card, so a long scroll moves many.
const STEP_PX = 70; let acc = 0, accT = 0;
strip.addEventListener("wheel", e => {
  e.preventDefault();
  let d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (e.deltaMode === 1) d *= 18; else if (e.deltaMode === 2) d *= 400;
  if (e.timeStamp - accT > 250) acc = 0; accT = e.timeStamp;
  acc += d; const n = Math.trunc(acc / STEP_PX);
  if (n) { acc -= n * STEP_PX; go(cur + n); }
}, { passive: false });
// Touch: the card follows the finger, one card per 60px of drag.
let ty = null;
strip.addEventListener("touchstart", e => { ty = e.touches[0].clientY; }, { passive: true });
strip.addEventListener("touchmove", e => { e.preventDefault(); if (ty === null) return;
  const dy = e.touches[0].clientY - ty, n = Math.trunc(-dy / 60);
  if (n) { ty -= -n * 60; go(cur + n); } }, { passive: false });
strip.addEventListener("touchend", () => { ty = null; });
function fromHash() { const k = location.hash.slice(1).toUpperCase(); const i = S.findIndex(s => s[0] === k); return i < 0 ? 3 : i; }
addEventListener("hashchange", () => go(fromHash()));
go(fromHash());
</script>
